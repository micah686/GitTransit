name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag gittransit:${{ github.sha }} app
      - name: Report final image size
        run: |
          size=$(docker image inspect gittransit:${{ github.sha }} --format='{{.Size}}')
          echo "bytes=$size"
          test "$size" -le 419430400
          docker history gittransit:${{ github.sha }} --no-trunc
      - name: Export release image
        run: docker save gittransit:${{ github.sha }} | gzip -9 > gittransit-image.tar.gz
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: gittransit:${{ github.sha }}
          format: spdx-json
          output-file: gittransit.spdx.json
      - name: Generate build manifest
        working-directory: app
        run: npm run provenance > ../gittransit-provenance.json
#      - name: Attest image archive
#        if: github.event_name != 'pull_request'
#        uses: actions/attest@v4
#        with:
#          subject-path: gittransit-image.tar.gz
#      - uses: actions/upload-artifact@v4
#        with:
#          name: release-evidence-${{ github.sha }}
#          path: |
#            gittransit.spdx.json
#            gittransit-provenance.json
      - name: Scan final image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gittransit:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
